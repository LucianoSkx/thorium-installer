name: build

on:
  push:
    tags:
      - 'v*'
  schedule:
    # todo dia as 6h UTC: recompila a versao mais recente do upstream
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (vazio = detecta a versao mais recente)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # beta (M156) — variantes de CPU
          - pkg: thorium-browser-beta-bin
            variant: SSE3
          - pkg: thorium-browser-beta-sse4-bin
            variant: SSE4
          - pkg: thorium-browser-beta-avx-bin
            variant: AVX
          - pkg: thorium-browser-beta-avx2-bin
            variant: AVX2
          - pkg: thorium-browser-beta-avx512-bin
            variant: AVX512
          # estável (M138)
          - pkg: thorium-browser-bin
            variant: SSE3
          - pkg: thorium-browser-avx-bin
            variant: AVX
          - pkg: thorium-browser-avx2-bin
            variant: AVX2

    steps:
      - uses: actions/checkout@v4

      # compila dentro de um container Arch: makepkg exige rodar fora do root
      - name: Build package
        uses: docker://archlinux:base-devel
        with:
          args: bash /github/workspace/.github/build-package.sh ${{ matrix.pkg }} ${{ matrix.variant }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg }}
          path: 'thorium-browser_*.pkg.tar.zst'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # sem tag manual: usa a versao mais recente publicada no upstream
      - name: Detect latest upstream version
        id: ver
        if: ${{ inputs.tag == '' }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/gz83/thorium/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          tag="${tag#M}"   # upstream usa M156.0.8078.28; aqui e so o numero
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"
          echo "versao detectada: $tag"
          echo "fonte original: https://github.com/gz83/thorium/releases/tag/M$tag"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || steps.ver.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Artefatos:"; ls -1 dist
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Thorium Browser ${TAG#v}" \
              --notes "Pacotes Arch gerados a partir do PKGBUILD do AUR.

          Fonte original: https://github.com/gz83/thorium/releases/tag/M${TAG#v}"
          fi
          # upload sequencial com retry: em paralelo o gh occasionally perde arquivos
          for f in dist/*.pkg.tar.zst; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$f"; then
                break
              fi
              echo "falhou o upload de $f (tentativa $attempt), tentando de novo"
              sleep 10
            done
          done
          echo "Assets no release:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
          esperado=$(ls -1 dist/*.pkg.tar.zst | wc -l)
          publicado=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')
          echo "esperados: $esperado  publicados: $publicado"
          [ "$esperado" = "$publicado" ]
