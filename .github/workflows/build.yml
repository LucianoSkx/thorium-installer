name: build

on:
  push:
    tags:
      - 'v*'
  schedule:
    # todo dia as 6h UTC: recompila a versao mais recente do upstream
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (vazio = detecta a versao mais recente)'
        required: false

jobs:
  # fonte única da versão: release mais recente do upstream (ou input manual)
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve upstream version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            ver="${INPUT_TAG#v}"; ver="${ver#M}"
          else
            ver=$(curl -fsSL https://api.github.com/repos/gz83/thorium/releases/latest \
              | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
            ver="${ver#M}"   # upstream usa M156.0.8078.28; aqui e so o numero
          fi
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "fonte original: https://github.com/gz83/thorium/releases/tag/M$ver"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # variantes de CPU
          - variant: SSE3
          - variant: SSE4
          - variant: AVX
          - variant: AVX2
          - variant: AVX512
          # outras arquiteturas
          - variant: arm64
            carch: aarch64
          - variant: i386
            carch: i686

    steps:
      - uses: actions/checkout@v4

      # compila dentro de um container Arch: makepkg exige rodar fora do root
      - name: Build package
        uses: docker://archlinux:base-devel
        with:
          args: bash /github/workspace/.github/build-package.sh ${{ matrix.variant }} ${{ needs.version.outputs.tag }} ${{ matrix.carch }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.variant }}
          path: 'thorium-browser_*.pkg.tar.zst'
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Artefatos:"; ls -1 dist
          # cinto de segurança: assets têm de ser da versão da tag; mismatch
          # sinaliza bug no reempacotamento, não espere o cleanup apagar tudo
          built=$(ls -1 dist/*.pkg.tar.zst | head -1)
          built="${built#*/thorium-browser_}"; built="${built%.pkg.tar.zst}"
          built_ver="${built%_*}"
          if [ "$built_ver" != "${TAG#v}" ]; then
            echo "assets em $built_ver, mas tag é ${TAG#v}; bug no reempacotamento"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Thorium Browser ${TAG#v}" \
              --notes "Pacotes Arch reempacotados do .deb oficial do upstream.

          Fonte original: https://github.com/gz83/thorium/releases/tag/M${TAG#v}"
          fi
          # remove assets obsoletos: nome antigo ou versao diferente da atual
          while read -r asset; do
            [ -n "$asset" ] || continue
            case "$asset" in
              thorium-browser_*) ;;
              *) echo "removendo asset obsoleto: $asset"
                 gh release delete-asset "$TAG" --repo "$GITHUB_REPOSITORY" "$asset" -y || true
                 continue ;;
            esac
            case "$asset" in
              thorium-browser_${TAG#v}_*) ;;
              *) echo "removendo asset de outra versao: $asset"
                 gh release delete-asset "$TAG" --repo "$GITHUB_REPOSITORY" "$asset" -y || true ;;
            esac
          done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')

          # checksums para o instalador conferir antes do pacman -U
          # shortcut: gerados pelo mesmo CI (protegem a transferência, sem assinatura)
          (cd dist && sha256sum *.pkg.tar.zst > SHA256SUMS)

          # upload sequencial com retry: em paralelo o gh occasionally perde arquivos
          for f in dist/*.pkg.tar.zst dist/SHA256SUMS; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$f"; then
                break
              fi
              echo "falhou o upload de $f (tentativa $attempt), tentando de novo"
              sleep 10
            done
          done
          echo "Assets no release:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
          esperado=$(( $(ls -1 dist/*.pkg.tar.zst | wc -l) + 1 ))   # pacotes + SHA256SUMS
          publicado=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')
          echo "esperados: $esperado  publicados: $publicado"
          [ "$esperado" = "$publicado" ]
