name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex: v156.0.8078.28)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # beta (M156) — variantes de CPU
          - pkg: thorium-browser-beta-bin
            asset: thorium-browser-beta-sse3
          - pkg: thorium-browser-beta-sse4-bin
            asset: thorium-browser-beta-sse4
          - pkg: thorium-browser-beta-avx-bin
            asset: thorium-browser-beta-avx
          - pkg: thorium-browser-beta-avx2-bin
            asset: thorium-browser-beta-avx2
          - pkg: thorium-browser-beta-avx512-bin
            asset: thorium-browser-beta-avx512
          # estável (M138)
          - pkg: thorium-browser-bin
            asset: thorium-browser-sse3
          - pkg: thorium-browser-avx-bin
            asset: thorium-browser-avx
          - pkg: thorium-browser-avx2-bin
            asset: thorium-browser-avx2

    steps:
      - uses: actions/checkout@v4

      # compila dentro de um container Arch: makepkg exige rodar fora do root
      - name: Build package
        uses: docker://archlinux:base-devel
        with:
          args: bash /github/workspace/.github/build-package.sh ${{ matrix.pkg }}

      - name: Rename artifact
        run: |
          rm -f *-debug-*.pkg.tar.zst
          pkg=$(ls *.pkg.tar.zst | grep -v -- '-debug-')
          mv "$pkg" "${{ matrix.asset }}.pkg.tar.zst"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: '${{ matrix.asset }}.pkg.tar.zst'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Artefatos:"; ls -1 dist
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Thorium Browser $TAG" \
              --notes "Pacotes Arch gerados a partir do PKGBUILD do AUR."
          fi
          # upload sequencial com retry: em paralelo o gh occasionally perde arquivos
          for f in dist/*.pkg.tar.zst; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$f"; then
                break
              fi
              echo "falhou o upload de $f (tentativa $attempt), tentando de novo"
              sleep 10
            done
          done
          echo "Assets no release:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
          esperado=$(ls -1 dist/*.pkg.tar.zst | wc -l)
          publicado=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')
          echo "esperados: $esperado  publicados: $publicado"
          [ "$esperado" = "$publicado" ]
